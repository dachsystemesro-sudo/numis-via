<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NUMIS VIA — Identification Engine v12</title><style>body{font-family:system-ui,sans-serif;max-width:920px;margin:auto;padding:24px;background:#faf9f6;color:#181818}h1{margin-bottom:4px}.sub{color:#666}.card{background:white;border:1px solid #ddd;border-radius:14px;padding:18px;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{padding:12px 18px;border-radius:10px;border:0;background:#111;color:#fff;font-weight:700}.muted{color:#777}.ok{font-weight:700}.row{padding:9px 0;border-bottom:1px solid #eee}.row:last-child{border:0}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body>
<h1>NUMIS VIA</h1><div class="sub">Identification Engine v12.1 — rodina mince → strana → konkrétna identifikácia</div>
<div class="card"><div class="grid"><label>Prvá strana<input id="a" type="file" accept="image/*"></label><label>Druhá strana<input id="b" type="file" accept="image/*"></label></div><p><button id="go">Analyzovať obe strany</button></p><div id="status" class="muted"></div></div>
<div id="out"></div>
<script>
const $=s=>document.querySelector(s); const pct=n=>`${Math.round(Number(n)||0)} %`;
async function dataUrl(file){const img=await createImageBitmap(file);let w=img.width,h=img.height,s=Math.min(1,1600/Math.max(w,h));let c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.88)}
function rows(arr,fn){return (arr||[]).map(x=>`<div class="row">${fn(x)}</div>`).join('')||'<div class="muted">Bez spoľahlivého údaja.</div>'}
$('#go').onclick=async()=>{if(!$('#a').files[0]||!$('#b').files[0])return $('#status').textContent='Nahraj obe strany mince.';$('#status').textContent='Analyzujem obe strany v jednom spoločnom kontexte…';$('#out').innerHTML='';try{let images=await Promise.all([dataUrl($('#a').files[0]),dataUrl($('#b').files[0])]);let r=await fetch('/api/analyze',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({images})});let d=await r.json();if(!r.ok)throw Error(d.error||'Analýza zlyhala');$('#status').textContent='Analýza dokončená.';$('#out').innerHTML=`<div class="card"><h2>1. Overené vizuálne znaky</h2>${rows(d.observations,x=>`<b>${x.side}</b> — ${x.feature}: ${x.value||'Neurčené'} <span class="muted">${pct(x.confidence)}</span>`)}</div><div class="card"><h2>2. Rodina mince</h2><div class="row"><b>${d.family.label}</b> — ${pct(d.family.confidence)}</div><div class="muted">${d.family.reason}</div></div><div class="card"><h2>3. Konkrétna identifikácia</h2>${rows(d.issue_candidates,x=>`<b>${x.label}</b> — ${pct(x.confidence)}<br><span class="muted">${x.reason}</span>`)}</div><div class="card"><h2>4. Potvrdené údaje</h2>${Object.entries(d.confirmed).map(([k,v])=>`<div class="row"><b>${k}:</b> ${v.value} <span class="muted">${pct(v.confidence)}${v.side?' · '+v.side:''}</span><br><small>${v.why||''}</small></div>`).join('')}</div><div class="card"><h2>Najlepší ďalší dôkaz</h2>${d.next_needed}</div>`}catch(e){$('#status').textContent=e.message}}
</script></body></html>
