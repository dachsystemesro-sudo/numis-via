<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NUMIS VIA — CoinPrint</title><style>
:root{--ink:#17140f;--muted:#716b61;--paper:#f4f0e7;--card:#fffdf8;--gold:#bd8329;--red:#a6332b;--green:#26734d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#fff9ea,var(--paper) 44%);color:var(--ink);font:16px/1.5 system-ui,sans-serif}.wrap{max-width:1040px;margin:auto;padding:28px 18px 64px}header{padding:20px 0 12px}h1{font-family:Georgia,serif;letter-spacing:.14em;margin:0;font-size:clamp(28px,6vw,48px)}h1 span{color:var(--gold)}.lead{color:var(--muted);max-width:720px}.card{background:var(--card);border:1px solid #d9cfbd;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 8px 28px #57451d12}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.slot{border:1px dashed #b6a98f;border-radius:13px;padding:14px}.slot strong{display:block}.slot small{color:var(--muted)}input{display:block;width:100%;margin-top:10px}button{border:0;border-radius:12px;padding:14px 22px;background:var(--ink);color:white;font-weight:750;font-size:16px;cursor:pointer}button:disabled{opacity:.5}.status{margin-left:12px;color:var(--muted)}.banner{border-left:6px solid;padding:16px 18px}.blocked{border-color:var(--red);background:#fff4f1}.verified{border-color:var(--green);background:#f0faf4}.badge{font-weight:800;letter-spacing:.08em}.rows{display:grid;gap:8px}.row{padding:11px 0;border-bottom:1px solid #e8e0d2}.row:last-child{border:0}.muted{color:var(--muted)}.bar{height:7px;background:#e5dccb;border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--gold)}@media(max-width:680px){.grid{grid-template-columns:1fr}.status{display:block;margin:10px 0 0}}
</style></head><body><main class="wrap"><header><h1>NUMIS <span>VIA</span></h1><p class="lead">CoinPrint porovnáva líce, rub, drobné značky, geometriu a voliteľne hranu mince v štyroch kontrolných priechodoch. Pri rozpore výsledok neuzamkne.</p></header>
<section class="card"><h2>Fotografie mince</h2><div class="grid"><label class="slot"><strong>Líce — povinné</strong><small>Kolmo, celé v zábere, bez odlesku</small><input id="obverse" type="file" accept="image/*"></label><label class="slot"><strong>Rub — povinné</strong><small>Rovnaké svetlo a mierka</small><input id="reverse" type="file" accept="image/*"></label><label class="slot"><strong>Hrana — odporúčané</strong><small>Nápis, ryhovanie alebo ornament</small><input id="edge" type="file" accept="image/*"></label><label class="slot"><strong>Mikrodetail — voliteľné</strong><small>Mincovná značka, autor alebo symbol</small><input id="detail" type="file" accept="image/*"></label></div><h2>Fyzické údaje</h2><p class="muted">Nie sú povinné pri prvom pokuse, ale pomáhajú rozlíšiť podobné varianty a repliky.</p><div class="grid"><label class="slot"><strong>Hmotnosť v gramoch</strong><input id="mass" type="number" min="0" step="0.01" inputmode="decimal"></label><label class="slot"><strong>Priemer v milimetroch</strong><input id="diameter" type="number" min="0" step="0.01" inputmode="decimal"></label><label class="slot"><strong>Hrúbka v milimetroch</strong><input id="thickness" type="number" min="0" step="0.01" inputmode="decimal"></label><label class="slot"><strong>Reakcia na magnet</strong><select id="magnetic"><option value="">Nezadané</option><option value="no">Nepriťahuje</option><option value="yes">Priťahuje</option><option value="partial">Iba čiastočne</option></select></label></div><p><button id="go">Spustiť CoinPrint</button><span id="status" class="status"></span></p></section><div id="out"></div></main>
<script>
const $=x=>document.querySelector(x), pct=x=>Math.round(Number(x)||0)+' %', esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function image(file){const bitmap=await createImageBitmap(file),scale=Math.min(1,2200/Math.max(bitmap.width,bitmap.height)),canvas=document.createElement('canvas');canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);const context=canvas.getContext('2d');context.drawImage(bitmap,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/jpeg',.93)}
function featureRows(features){return Object.entries(features).map(([name,x])=>`<div class="row"><b>${esc(name)}</b>: ${esc(x.value||'Neurčené')} <span class="muted">${pct(x.confidence)} · ${x.agreement_count}/3 primárne priechody</span><br><small>${esc(x.visible_evidence||'Bez lokalizovaného dôkazu')}${x.region?' · '+esc(x.region):''}</small>${x.conflicts?.length?`<br><small style="color:var(--red)">Rozpor: ${esc(x.conflicts.join(', '))}</small>`:''}</div>`).join('')}
$('#go').onclick=async()=>{const files=[$('#obverse').files[0],$('#reverse').files[0],$('#edge').files[0],$('#detail').files[0]].filter(Boolean);if(!$('#obverse').files[0]||!$('#reverse').files[0])return $('#status').textContent='Najprv nahraj líce aj rub.';$('#go').disabled=true;$('#status').textContent='Prebiehajú štyri nezávislé kontroly…';$('#out').innerHTML='';try{const images=await Promise.all(files.map(image)),measurements={mass_g:$('#mass').value?Number($('#mass').value):null,diameter_mm:$('#diameter').value?Number($('#diameter').value):null,thickness_mm:$('#thickness').value?Number($('#thickness').value):null,magnetic:$('#magnetic').value||null},response=await fetch('/api/analyze',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({images,measurements})}),data=await response.json();if(!response.ok)throw Error(data.error||'Analýza zlyhala.');const ok=data.status==='VERIFIED';$('#out').innerHTML=`<section class="card banner ${ok?'verified':'blocked'}"><div class="badge">${ok?'IDENTITA OVERENÁ':'IDENTIFIKÁCIA ZABLOKOVANÁ'}</div><h2>${ok?esc(data.identity.label||data.identity.catalogue_identity):'Mincu zatiaľ nemožno bezpečne určiť'}</h2><p>${ok?'Ocenenie je povolené. Istota: '+pct(data.confidence):'Ocenenie zostáva zablokované, aby sa neocenila nesprávna minca.'}</p></section>${data.blockers?.length?`<section class="card"><h2>Čo bráni potvrdeniu</h2><div class="rows">${data.blockers.map(x=>`<div class="row">${esc(x)}</div>`).join('')}</div></section>`:''}<section class="card"><h2>Digitálny odtlačok CoinPrint</h2>${featureRows(data.features)}</section><section class="card"><h2>Kvalita podkladov</h2>${Object.entries(data.quality.scores).map(([k,v])=>`<div class="row"><b>${esc(k)}</b> ${pct(v)}<div class="bar"><i style="width:${v}%"></i></div></div>`).join('')}</section>${data.next_needed?.length?`<section class="card"><h2>Najlepší ďalší dôkaz</h2>${data.next_needed.map(x=>`<div class="row">${esc(x)}</div>`).join('')}</section>`:''}`;$('#status').textContent='Kontrola dokončená.'}catch(error){$('#status').textContent=error.message}finally{$('#go').disabled=false}}
</script></body></html>
