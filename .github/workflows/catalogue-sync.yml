name: Synchronizácia otvoreného katalógu

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/catalogue-sync.yml'
      - 'scripts/sync-open-catalogues.mjs'
      - 'scripts/persist-catalogue.sh'
  schedule:
    - cron: '17 2 * * *'
    - cron: '47 14 * * *'

permissions:
  contents: write

concurrency:
  group: catalogue-sync
  cancel-in-progress: false

jobs:
  sync-ocre:
    # Manual dispatch from a feature branch must never write its HEAD to main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Načítať ďalšiu dávku OCRE
        run: node scripts/sync-open-catalogues.mjs
        env:
          CATALOGUE_BATCH_SIZE: '50'
          CATALOGUE_BATCHES_PER_RUN: '4'
      - name: Overiť projekt
        run: npm run check
      - name: Uložiť nové katalógové dáta
        run: bash scripts/persist-catalogue.sh
