name: Kontrola NUMIS VIA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, pilot/sk-eurocents-evidence-and-safety, integration/coinprint-safety-20261112]
  workflow_dispatch:
  # Commits made with GITHUB_TOKEN do not trigger another push workflow.
  workflow_run:
    workflows: ['Synchronizácia otvoreného katalógu']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: coinprint-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Verify current main after the catalogue bot has pushed its commit.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked test dependencies
        run: npm ci
      - name: Kontrola syntaxe a regresných testov
        run: npm run check
      - name: Audit pripravenosti fyzického pilotu (informatívny)
        shell: bash
        run: node scripts/audit-readiness.mjs | tee readiness-report.json
      - name: Uchovať dôkaz auditu
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readiness-report
          path: readiness-report.json
          if-no-files-found: error
